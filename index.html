window.JobsAcLanguage={
isChinese:function(){return true;},
replaceTextNodes:function(element,translations,originalText,chinese){
var walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT,null);
var node;
while((node=walker.nextNode())){
var text=node.textContent.trim();
if(translations[text])node.textContent=node.textContent.replace(text,translations[text]);
}
}
};
